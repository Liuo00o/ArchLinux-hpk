# /etc/mkinitcpio-z1.conf
# z1 定制内核的通用 initramfs 配置 —— 目标是"一台编译，装到各种机器"
#
# ★ 关键：HOOKS 里【没有 autodetect】。
#   autodetect 会把 initramfs 限定为"当前这台机器"的驱动，换一台机器就可能
#   VFS: Unable to mount root fs on unknown-block。
#   代价：通用 initramfs 体积明显大于 hostonly（实测量级 45MB -> 128MB），
#   这是为"换机可用"主动付出的代价，符合本项目定位。
#
# 用法：sudo mkinitcpio -k <kernelrelease> -g /boot/initramfs-z1.img -c /etc/mkinitcpio-z1.conf

MODULES=()
BINARIES=()
FILES=()

# 不含 kms：省下 20-30MB 的 GPU 固件，EFI 帧缓冲由 FB_EFI + simpledrm 兜底。
# 若目标机是桌面且希望开机即有原生分辨率，在 HOOKS 的 block 前加 kms（体积换体验）。
HOOKS=(base udev microcode modconf block filesystems keyboard fsck)

# 压缩：zstd -19 管体积。initramfs 是三者中体积基数最大的（通用型约 100MB+），
# 比率优先；-T0 用满多核压缩，只影响构建时间不影响启动。
# 若想换 lz4 做 A/B：COMPRESSION="lz4" 并把下面这行注释掉（需 CONFIG_RD_LZ4=y，已开）。
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)

# 压缩后校验用：
#   lsinitramfs /boot/initramfs-z1.img | grep -E 'nvme|ahci|sd_mod|ext4|xfs'   # 根盘与根文件系统必须在
